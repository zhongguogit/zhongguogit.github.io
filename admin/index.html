<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>核销台 · 站长专用</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --brand:#6366f1;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.6;padding:20px;min-height:100vh}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:#0f172a;color:var(--tx);font-size:15px;font-family:var(--mono);letter-spacing:.15em;
  outline:none;margin-bottom:12px;text-align:center}
.gate input:focus{border-color:var(--brand)}
button{cursor:pointer;font-family:inherit;border:none;border-radius:9px;font-size:14px;font-weight:600;padding:11px 20px}
.primary{background:var(--brand);color:#fff;width:100%}
.primary:hover{opacity:.9}
.err{color:#fca5a5;font-size:13px;margin-top:10px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.st b{display:block;font-size:24px;font-family:var(--mono);line-height:1.2}
.st span{font-size:11.5px;color:var(--tx3)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.tab{background:var(--card);color:var(--tx2);border:1px solid var(--line);padding:7px 15px;font-size:13px;font-weight:500}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.toolbar .right{margin-left:auto;display:flex;gap:8px}
.ghost{background:transparent;color:var(--tx2);border:1px solid var(--line);padding:7px 15px;font-size:13px;font-weight:500}
.o{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.o-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.oid{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.04em}
.time{font-size:11.5px;color:var(--tx3);white-space:nowrap}
.o-mid{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px;font-size:14px}
.amt{font-family:var(--mono);font-size:17px;font-weight:700;color:#86efac;white-space:nowrap}
.should{font-family:var(--sans);font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:6px}
.o-c{font-size:13px;color:var(--tx2);margin-bottom:3px;word-break:break-all}
.o-c b{color:var(--tx)}
.cpk{margin-left:6px;border:1px solid #065f46;background:transparent;color:#34d399;
  border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;font-weight:600}
.cpk:hover{background:#065f46;color:#fff}
.o-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.o-act button{padding:8px 14px;font-size:13px}
.o-act .ok{background:var(--ok);color:#03291c}
.o-act .no{background:transparent;color:#fca5a5;border:1px solid #7f1d1d}
.o-act .del{background:transparent;color:var(--tx3);border:1px solid var(--line);margin-left:auto;font-weight:500}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:30px 10px;line-height:1.9}
code{background:#0f172a;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12.5px;color:#a5b4fc}
footer{text-align:center;color:var(--tx3);font-size:12px;padding:20px 0}
footer a{color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧾 核销台</h1>
  <div class="sub">用户付款后在这里核对到账，点一下就开通。</div>

  <div class="card gate" id="gate">
    <input id="pin" placeholder="输入口令（字母+数字）" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="primary" id="btnLogin">进入</button>
    <div class="err" id="pinErr"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="stats">
      <div class="st"><b id="cPending" style="color:#fbbf24">0</b><span>待核验</span></div>
      <div class="st"><b id="cPaid" style="color:#34d399">0</b><span>已开通</span></div>
      <div class="st"><b id="cAll">0</b><span>全部订单</span></div>
    </div>

    <div class="toolbar">
      <button class="tab on" data-f="pending">待核验</button>
      <button class="tab" data-f="paid">已开通</button>
      <button class="tab" data-f="rejected">已驳回</button>
      <button class="tab" data-f="all">全部</button>
      <div class="right"><button class="ghost" id="btnRefresh">刷新</button></div>
    </div>

    <div id="list"></div>
  </div>

  <footer>
    口令在 <code>/pay/config.js</code> 的 <code>adminPin</code> ·
    <a href="/pay/">← 收款页</a>
  </footer>
</div>

<script src="/pay/config.js"></script>
<script src="/admin/admin.js"></script>
</body>
</html>
