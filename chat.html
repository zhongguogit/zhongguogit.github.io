<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线交流 · 一对一咨询 & 前沿纠错群</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a24;--panel2:#1e2330;--line:#2a2f40;--text:#e8eaf0;--muted:#8b91a5;--accent:#5b8cff;--gold:#d4a94e;--ok:#3ecf8e;--warn:#ffb454}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:15px}
  .tabs{display:flex;gap:8px;margin-left:auto}
  .tab{padding:6px 14px;border-radius:18px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--muted)}
  .tab.on{border-color:var(--accent);color:var(--accent);background:rgba(91,140,255,.08)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:4px}
  .msg.ai,.msg.g{align-self:flex-start}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .who{font-size:10px;color:var(--muted);padding:0 6px}
  .bubble{padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.65}
  .ai .bubble{background:var(--panel2);border:1px solid var(--line);border-top-left-radius:4px}
  .me .bubble{background:var(--accent);border-top-right-radius:4px}
  .g .bubble{background:#241f30;border:1px solid #3d3455;border-top-left-radius:4px}
  .g .who b{color:var(--gold)}
  .sys{align-self:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;text-align:center;max-width:90%}
  .cta{align-self:flex-start;background:linear-gradient(160deg,#1d2438,#251f33);border:1px solid var(--gold);border-radius:13px;padding:12px 14px;max-width:88%;font-size:13px;line-height:1.7}
  .cta b{color:var(--gold)}
  .cta button{margin-top:8px;padding:7px 16px;border-radius:9px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:12px;cursor:pointer}
  .cta button:hover{background:var(--gold);color:#111}
  footer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel)}
  .row{display:flex;gap:10px;max-width:820px;margin:0 auto}
  input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  .btn{padding:11px 22px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
  .hint{max-width:820px;margin:6px auto 0;font-size:11px;color:var(--muted);text-align:center}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
  .modal.on{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:24px;width:320px}
  .sheet h3{color:var(--gold);font-size:16px;margin-bottom:12px}
  .sheet p{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
  .sheet input{width:100%;margin-bottom:10px}
  .sheet .btn{width:100%}
  .x{float:right;cursor:pointer;color:var(--muted)}
  .notice{max-width:820px;margin:10px auto 0;padding:8px 14px;font-size:11px;line-height:1.7;color:var(--warn);background:rgba(255,180,84,.07);border:1px solid rgba(255,180,84,.35);border-radius:10px}
  .notice b{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>💬 ZGG 在线交流</h1>
  <div class="tabs">
    <div class="tab on" data-m="private">一对一咨询</div>
    <div class="tab" data-m="group">🛡️ 前沿纠错群</div>
    <div class="tab" data-m="match">🤝 匹配大厅</div>
  </div>
</header>

<div class="notice">⚠️ 本站仅讨论「前沿纠错 skill」协作话题 · 聊天记录<b>不保存</b>、刷新即清空 · 无关内容会被定期清理，请勿在此留存重要信息</div>

<div id="chat"></div>

<footer>
  <div class="row"><input id="inp" placeholder="输入消息，回车发送…" autocomplete="off"><button class="btn" onclick="send()">发送</button></div>
  <div class="hint">匹配大厅支持：接龙：你的痛点（上榜全球案例）· 接龙榜 · 预售（锁早鸟）· 对接（联系商家）· 重新匹配</div>
</footer>

<div class="modal" id="modal">
  <div class="sheet">
    <span class="x" onclick="modal.classList.remove('on')">✕</span>
    <h3>🛡️ 申请加入 前沿纠错群</h3>
    <p>群内福利：每日专家话术、预测视频实战、1~2 字纠错交流、军师救场。留下联系方式，群主拉你进群。</p>
    <input id="f-name" placeholder="你的昵称">
    <input id="f-contact" placeholder="微信号 / 邮箱">
    <button class="btn" onclick="join()">提交申请</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp'),modal=document.getElementById('modal');
let mode='private',turn=0,joined=false;

const PRIVATE=[
  '你好！我是 ZGG 商店的 AI 客服 👋 听说你对「预测式视频聊天器」感兴趣？说说你的使用场景吧，我帮你判断适不适合。',
  '好选择！这个 skill 最大的价值是：**说话成本降到 1~2 个字**，力气全用在精准上。你现在交流中最头疼的是什么——打字慢？说不专业？还是聊着聊着冷场？',
  '明白了！这个场景我们的 💡专家话术 + 🛡️军师救场 正好对症。聊到这里你已经获得 **v2.0 Pro 七天试用资格** 🎉 下单立减，要不要再看看纠错群？群里每天都有实战案例。'
];
const GROUP_REPLIES=[
  {who:'群主·ZGG',t:'欢迎新朋友！群规只有一条：**预测错了，1~2 个字纠错就够，别长篇大论** 😄'},
  {who:'阿珂',t:'刚用军师救场化解了一场和客户的僵局，视频预测精准度肉眼可见地涨了'},
  {who:'老周',t:'💡今日专家话术：「这本质是一个优先级折叠问题」——大白话：先把不重要的事合并掉'}
];

// ———————— 匹配大厅：痛点建档 → 预售匹配 → 公司撮合 ————————
const COMPANIES=[
  {name:'星桥智能（AI 产品化）',tag:'AI Agent / 多模态',cap:'有 VideoGen 级视频生成产线，擅长把对话类 skill 做成 App',fit:['预测视频','聊天','App','多模态']},
  {name:'极语科技（即时通讯云）',tag:'IM / 音视频',cap:'自有 IM SDK 与纠错输入法引擎，可承载高并发聊天纠错',fit:['聊天','纠错','输入','IM']},
  {name:'深研社（企业话术咨询）',tag:'咨询 / 培训',cap:'专家话术库授权方，为纠错 skill 提供专家语料与行业认证',fit:['话术','专家','咨询','培训']},
  {name:'量知数据（NLP 中台）',tag:'NLP / 语义纠错',cap:'中文语义纠错模型，可显著提升 1~2 字纠错准确率',fit:['纠错','NLP','语义','准确率']}
];

let matchStage=0, matchData={pain:'', presale:''};

// ———— 全球痛点接龙：大神接力分享，痛点沉淀为案例，直接驱动预售与商家撮合 ————
const CASES=[
  {who:'Lisa·硅谷',pain:'跨时区团队开会，说不到重点，每场多烧 40 分钟',heat:86,make:'星桥智能（AI 产品化）'},
  {who:'Kenji·东京',pain:'老人用语音助手，说错一个词整句话作废，需要 1~2 字纠错',heat:78,make:'量知数据（NLP 中台）'},
  {who:'阿茂·深圳',pain:'客服培训 3 个月才会的话术，新人上手就能说出来',heat:91,make:'深研社（企业话术咨询）'},
  {who:'Maria·柏林',pain:'视频会议里情绪误读导致误判，想要视频代言缓和表达',heat:69,make:'极语科技（即时通讯云）'}
];
function casesBoard(){
  const top=[...CASES].sort((a,b)=>b.heat-a.heat).slice(0,5);
  let h='<b>🔥 全球痛点接龙榜</b>（预售热度排序）<br><br>';
  top.forEach((c,i)=>h+=`${i+1}. ${c.pain}<br><span style="color:var(--muted)">　来自 ${c.who} · 预售热度 <b style="color:var(--warn)">${c.heat}</b> · 可生产方：<b style="color:var(--gold)">${c.make}</b></span><br><br>`);
  h+=`<b>接龙方式：</b>发送「接龙：你的痛点」，立即上榜，热度由预售意愿实时累积；每个案例都会直接推送给能生产它的实力商家。当前全球共 <b>${CASES.length}</b> 条接龙案例。`;
  return h;
}
function jielong(t){
  const pain=t.replace(/^接龙[:：]?\s*/,'').trim();
  if(!pain)return '请按格式发送：<b>接龙：你的痛点</b>';
  // 根据痛点关键词分配可生产的商家
  const best=COMPANIES.map(c=>({c,hit:c.fit.filter(k=>pain.includes(k)).length})).sort((a,b)=>b.hit-a.hit)[0].c;
  const heat=60+Math.floor(Math.random()*39);
  CASES.unshift({who:'你（本次会话）',pain,heat,make:best.name});
  return `✅ 接龙成功，已上榜（预售热度 ${heat}）！<br><br>「${pain.replace(/</g,'&lt;')}」<br><br>🤝 已推送给可生产方：<b style="color:var(--gold)">${best.name}</b>（${best.cap}）<br>当该痛点预售人数达标，将自动开启<b>预售匹配</b>——回复「预售」锁定早鸟资格，或发送「重新匹配」走完整撮合流程。`;
}
const PAIN_QS=[
  '🤝 <b>第一步 · 痛点建档</b><br>请用一句话描述你遇到的痛点（尽量具体）：例如「团队聊天表达不专业，客户不信任」',
  '📊 <b>第二步 · 预售匹配</b><br>如果有一个产品能解决它，你愿意以预售价支持吗？回复：<b>预售</b>（愿意，享早鸟价）/ <b>观望</b> / <b>已有方案</b>',
  '🏭 <b>第三步 · 公司撮合</b><br>正在为你匹配能生产此类前沿纠错产品的实力公司…'
];

function matchReply(t){
  if(matchStage===0){matchData.pain=t;matchStage=1;return PAIN_QS[1];}
  if(matchStage===1){
    matchData.presale=t;matchStage=2;
    const presaleOk=/预售|愿意|早鸟|要/.test(t);
    // 按痛点关键词算匹配度
    const scored=COMPANIES.map(c=>{
      const hit=c.fit.filter(k=>matchData.pain.includes(k)||t.includes(k)).length;
      return {c,score:Math.min(96,62+hit*12+Math.floor(Math.random()*6))};
    }).sort((a,b)=>b.score-a.score).slice(0,3);
    let html='匹配完成！为你撮合 <b>3 家</b>有实力把「前沿纠错产品」生产出来的公司：<br><br>';
    scored.forEach(({c,score},i)=>{
      html+=`<b style="color:var(--gold)">${i+1}. ${c.name}</b>（匹配度 <b style="color:var(--ok)">${score}%</b>）<br>方向：${c.tag}<br>实力：${c.cap}<br><br>`;
    });
    html+=presaleOk
      ?'🎁 你已选择<b>预售</b>：匹配公司将在 7 天内通过你留下的联系方式发起早期合作对接（预售早鸟价锁定）。<br>💬 提交联系方式完成撮合 →'
      :'以上公司可随时启动生产对接。想推进合作，回复「对接」并留下联系方式即可。';
    return html;
  }
  return '已记录你的补充。如需重新匹配，回复「重新匹配」。';
}

function openContact(title){
  document.querySelector('#modal h3').textContent='🤝 '+title;
  document.querySelector('#modal p').textContent='本表单仅用于本次撮合对接，不做持久存储；提交后匹配公司会尽快联系你。';
  modal.classList.add('on');
  document.getElementById('f-name').placeholder='你的昵称';
  document.getElementById('f-contact').placeholder='微信号 / 邮箱';
}
const _join=join;
join=function(){
  const name=document.getElementById('f-name').value.trim()||'朋友';
  const c=document.getElementById('f-contact').value.trim();
  if(!c){alert('请留下联系方式');return;}
  modal.classList.remove('on');
  if(mode==='match'){
    chat.appendChild(el(`<div class="sys">✅ 撮合成功！<b style="color:var(--ok)">${name}</b>，匹配公司将通过 <b style="color:var(--gold)">${c.replace(/</g,'&lt;')}</b> 联系你；本页不留存该信息</div>`));
    chat.appendChild(el(`<div class="msg ai"><div class="bubble">🤝 对接编号 <b>#PC-${Date.now()%100000}</b> 已生成（仅本次会话有效）。预计 7 天内收到公司方邀约，祝合作愉快！</div></div>`));
    matchStage=0;scroll();return;
  }
  _join();
};

function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function scroll(){chat.scrollTop=1e9;}

// —— 会话卫生：只保留最近 40 条消息，防卡顿；聊天记录永不落盘 ——
const MAX_MSGS=40;
function trimChat(){
  const msgs=[...chat.querySelectorAll('.msg,.cta')];
  if(msgs.length>MAX_MSGS){
    chat.insertBefore(el(`<div class="sys">🧹 早期消息已按站点规则自动清理（本站聊天记录不保存）</div>`),msgs[0]);
    msgs.slice(0,msgs.length-MAX_MSGS).forEach(m=>m.remove());
  }
}

// —— 主题守卫：只聊前沿纠错 skill，跑题则礼貌拉回 ——
const TOPIC_KEYS=/(纠错|skill|预测|视频|聊天|军师|话术|专家|试用|购买|价格|入群|客服|商店|下载)/;
const OFFTOPIC='这个小话题我们暂且放下 🙂 本站专注于「前沿纠错 skill」的协作交流——预测视频代言、1~2 字纠错、专家话术、军师救场。说说你在这块遇到的问题？';

function addMe(t){chat.appendChild(el(`<div class="msg me"><div class="bubble">${t.replace(/</g,'&lt;')}</div></div>`));trimChat();scroll();}

function greet(){
  if(mode==='private'){
    chat.innerHTML='';
    chat.appendChild(el(`<div class="sys">🔐 一对一咨询 · 由 AI 客服接待 · 本对话<b style="color:var(--warn)">不留存任何记录</b>，刷新即清空</div>`));
    bot(PRIVATE[0]);
  }else if(mode==='match'){
    chat.innerHTML='';
    chat.appendChild(el(`<div class="sys">🤝 匹配大厅 · 痛点建档 → 预售匹配 → 实力公司撮合 · 三步完成</div>`));
    matchStage=0;
    chat.appendChild(el(`<div class="msg ai"><div class="bubble">${PAIN_QS[0]}</div></div>`));
    chat.appendChild(el(`<div class="msg ai"><div class="bubble">${casesBoard()}</div></div>`));
    scroll();
  }else{
    chat.innerHTML='';
    chat.appendChild(el(`<div class="sys">🛡️ 前沿纠错群 · 256 位群友在线 · 发言即纠错交流</div>`));
    GROUP_REPLIES.forEach(r=>chat.appendChild(el(`<div class="msg g"><div class="who"><b>${r.who}</b></div><div class="bubble">${r.t}</div></div>`)));
    if(!joined) chat.appendChild(el(`<div class="cta">想和这些群友一起交流？<br><b>点击申请加入 前沿纠错群</b><br><button onclick="modal.classList.add('on')">立即申请</button></div>`));
    scroll();
  }
}

function bot(t,delay=800){
  const n=el(`<div class="msg ai typing" style="font-size:12px;color:var(--muted)">客服正在输入…</div>`);
  chat.appendChild(n);scroll();
  setTimeout(()=>{n.remove();
    chat.appendChild(el(`<div class="msg ai"><div class="bubble">${t}</div></div>`));
    if(turn>=3) chat.appendChild(el(`<div class="cta">🎁 你的 <b>试用资格已到账</b>！还想进 <b>前沿纠错群</b> 和 256 位群友每天切磋？<br><button onclick="modal.classList.add('on')">申请入群</button></div>`));
    scroll();
  },delay);
}

function send(){
  const t=inp.value.trim();if(!t)return;inp.value='';
  addMe(t);
  if(!TOPIC_KEYS.test(t)){ // 跑题：引导回纠错主题
    if(mode==='private'){bot(OFFTOPIC);}
    else{
      const n=el(`<div class="msg g typing" style="font-size:12px;color:var(--muted)">群主·ZGG 正在输入…</div>`);
      chat.appendChild(n);scroll();
      setTimeout(()=>{n.remove();chat.appendChild(el(`<div class="msg g"><div class="who"><b>群主·ZGG</b></div><div class="bubble">群规第一条：只聊前沿纠错 skill 😄 ${OFFTOPIC.replace('这个小话题我们暂且放下 🙂 ','')}</div></div>`));trimChat();scroll();},1000);
    }
    return;
  }
  if(mode==='match'){
    if(/^接龙[:：]/.test(t)){bot(jielong(t));return;}
    if(/^接龙榜$/.test(t)){bot(casesBoard());return;}
    if(/^预售$/.test(t)){openContact('预售早鸟资格锁定');return;}
    if(/^重新匹配$/.test(t)){matchStage=0;bot(PAIN_QS[0]);return;}
    if(/^对接$/.test(t)){openContact('实力公司对接');return;}
    bot(matchReply(t));return;
  }
  if(mode==='private'){bot(PRIVATE[Math.min(++turn,2)]);}
  else{ // 群聊：随机群友接话
    const r=GROUP_REPLIES[Math.floor(Math.random()*GROUP_REPLIES.length)];
    const n=el(`<div class="msg g typing" style="font-size:12px;color:var(--muted)">${r.who} 正在输入…</div>`);
    chat.appendChild(n);scroll();
    setTimeout(()=>{n.remove();chat.appendChild(el(`<div class="msg g"><div class="who"><b>${r.who}</b></div><div class="bubble">${r.t}</div></div>`));trimChat();scroll();},1000);
  }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});

function join(){
  const name=document.getElementById('f-name').value.trim()||'朋友';
  const c=document.getElementById('f-contact').value.trim();
  if(!c){alert('请留下联系方式');return;}
  joined=true;modal.classList.remove('on');
  const card=chat.querySelector('.cta');if(card)card.remove();
  chat.appendChild(el(`<div class="sys">✅ <b style="color:var(--ok)">${name}</b>，入群申请已提交！聊天内容不做保存，入群后请到群内交流；群主会通过 <b style="color:var(--gold)">${c.replace(/</g,'&lt;')}</b> 联系你（仅用于本次联系，不入库）</div>`));
  chat.appendChild(el(`<div class="msg g"><div class="who"><b>群主·ZGG</b></div><div class="bubble">收到！今晚 8 点群内有「预测视频实战纠错」直播，来了就能上手 😄</div></div>`));
  scroll();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');mode=t.dataset.m;turn=0;greet();
});
greet();
</script>
</body>
</html>
