<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhongguogit 的主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding: 40px 20px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header {
      text-align: center;
      color: #fff;
      margin-bottom: 36px;
    }
    header h1 { font-size: 32px; margin-bottom: 8px; }
    header p { font-size: 15px; opacity: 0.85; }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      gap: 18px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    }
    .icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      flex-shrink: 0;
    }
    .icon-msg { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .icon-drama { background: linear-gradient(135deg, #ec4899, #f59e0b); }
    .info h2 { font-size: 18px; color: #1f2937; margin-bottom: 4px; }
    .info p { font-size: 14px; color: #6b7280; line-height: 1.5; }
    footer {
      text-align: center;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>欢迎来到 zhongguogit 的主页</h1>
      <p>选择一个应用开始使用</p>
    </header>

    <a class="card" href="/my-first-app/">
      <div class="icon icon-msg">💬</div>
      <div class="info">
        <h2>私密留言板（第一仓库）</h2>
        <p>留言、查看记录，支持管理员回复</p>
      </div>
    </a>

    <a class="card" href="/zhongguogit/">
      <div class="icon icon-msg">📝</div>
      <div class="info">
        <h2>私密留言板（第二仓库）</h2>
        <p>另一套留言板，共用同一个 Supabase 数据库</p>
      </div>
    </a>

    <a class="card" href="/zhongguogit/drama-maker.html">
      <div class="icon icon-drama">🎬</div>
      <div class="info">
        <h2>AI 短剧制作工具</h2>
        <p>快速制作短剧内容的工具</p>
      </div>
    </a>

    <footer>© 2026 zhongguogit · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
