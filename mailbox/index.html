<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>站内邮箱 · 仅限内部交流</title>
<meta name="description" content="站内邮箱系统，仅限本站内部交流，严禁外部链接，管理员监督。">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b);min-height:100vh;color:#e2e8f0}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  header{background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:18px;padding:20px;color:#fff;box-shadow:0 10px 30px rgba(99,102,241,.3);margin-bottom:16px}
  header h1{font-size:22px;display:flex;align-items:center;gap:8px}
  .sub{font-size:12px;opacity:.9;margin-top:4px}
  .user-strip{display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px}
  .badge{background:rgba(255,255,255,.2);padding:5px 12px;border-radius:20px;font-size:13px}
  .notice{background:#fef3c7;color:#92400e;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.7;margin-bottom:14px;border-left:4px solid #f59e0b}
  nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:9px 14px;border-radius:10px;background:#334155;color:#cbd5e1;cursor:pointer;font-size:13px;border:none;font-weight:500}
  .tab.active{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
  .card{background:#1e293b;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #334155}
  .msg-item{background:#0f172a;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #334155;cursor:pointer}
  .msg-item.unread{border-left:4px solid #6366f1}
  .msg-item .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .msg-item .who{font-weight:600;font-size:14px}
  .msg-item .subj{font-size:13px;color:#cbd5e1;margin-top:4px}
  .msg-item .time{font-size:11px;color:#64748b}
  .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}
  .tag-r{background:#450a0a;color:#f87171}
  .tag-g{background:#064e3b;color:#34d399}
  .tag-b{background:#1e3a8a;color:#93c5fd}
  .input,.textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:14px;margin-bottom:10px;outline:none}
  .input:focus,.textarea:focus{border-color:#6366f1}
  .textarea{min-height:120px;resize:vertical}
  .btn{padding:11px 18px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer}
  .btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;width:100%}
  .btn-ghost{background:#334155;color:#cbd5e1}
  .btn-danger{background:#dc2626;color:#fff}
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:none;align-items:center;justify-content:center;padding:16px}
  .modal-mask.show{display:flex}
  .modal{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}
  .modal h3{margin-bottom:14px}
  .close-x{float:right;cursor:pointer;font-size:22px;color:#94a3b8}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#6366f1;color:#fff;padding:10px 20px;border-radius:10px;z-index:9999;font-size:14px;opacity:0;transition:.3s}
  .toast.show{opacity:1}
  .empty{text-align:center;color:#64748b;padding:30px 0;font-size:14px}
  .rules{background:#0f172a;border-radius:12px;padding:14px;font-size:13px;line-height:1.9}
  .rules ol{padding-left:20px}
  footer{text-align:center;color:#64748b;font-size:12px;padding:20px 0}
  a{color:#818cf8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📬 站内邮箱</h1>
    <div class="sub">仅限本站内部交流 · 严禁外部链接 · 管理员全程监督</div>
    <div class="user-strip">
      <span class="badge" id="u-name">加载中…</span>
      <span class="badge" id="u-admin" style="display:none">🛡️ 邮箱管理员</span>
      <span class="badge" id="u-unread">📥 0 未读</span>
    </div>
  </header>

  <div class="notice">
    ⚠️ <b>站内邮箱管理制度：</b>邮箱仅限本站用户之间内部交流使用，<b>严禁发送或接收任何外部链接</b>（http://、https://、网址等），违者将被严肃处理并追究责任。管理员负责监督执行，确保站内一片净土、安全稳定运行。
  </div>

  <nav>
    <button class="tab active" data-tab="inbox">📥 收件箱</button>
    <button class="tab" data-tab="sent">📤 已发送</button>
    <button class="tab" data-tab="compose">✉️ 写邮件</button>
    <button class="tab" data-tab="rules">📜 管理制度</button>
    <button class="tab" data-tab="admin" id="tab-admin" style="display:none">🛡️ 管理后台</button>
  </nav>

  <main id="main"></main>
  <footer>站内邮箱 v1.0 · 内部交流专用 · <a href="/">← 返回首页</a></footer>
</div>

<div class="modal-mask" id="modal"><div class="modal"><span class="close-x" onclick="closeModal()">×</span><h3 id="modal-title">标题</h3><div id="modal-body"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/site-auth.js?v=3"></script>
<script>
const SUPABASE_URL='https://dnqswjrevffwdcksnwan.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_O23O8vd8DYWDBoydPjl9LA_uYGspSHC';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me=null;
let isAdmin=false;
let currentTab='inbox';

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function openModal(title,html){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=html;document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

// 检测外部链接
function hasExternalLink(text){
  return /https?:\/\/|www\.\w+\.[a-z]{2,}|[\w-]+\.(com|cn|net|org|io|xyz|top|vip|cc|tv|me|info|biz)(\/|$)/i.test(text||'');
}

function loadAdminStatus(){
  isAdmin = SiteAuth.isAdmin();
  document.getElementById('u-admin').style.display=isAdmin?'inline-block':'none';
  document.getElementById('tab-admin').style.display=isAdmin?'inline-block':'none';
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));
async function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.getElementById('main').innerHTML='<div class="empty">加载中…</div>';
  if(tab==='inbox')await renderInbox();
  else if(tab==='sent')await renderSent();
  else if(tab==='compose')renderCompose();
  else if(tab==='rules')renderRules();
  else if(tab==='admin')await renderAdmin();
}

// ========== 收件箱 ==========
async function renderInbox(){
  const {data}=await sb.from('mail_messages').select('*').eq('recipient',me.username).eq('recipient_deleted',false).order('created_at',{ascending:false});
  const list=data||[];
  const unread=list.filter(m=>!m.is_read).length;
  document.getElementById('u-unread').textContent=`📥 ${unread} 未读`;
  if(!list.length){document.getElementById('main').innerHTML='<div class="empty">收件箱是空的～</div>';return;}
  document.getElementById('main').innerHTML=list.map(m=>`
    <div class="msg-item ${m.is_read?'':'unread'}" onclick="viewMessage(${m.id},'inbox')">
      <div class="row">
        <span class="who">${m.has_link?'<span class="tag tag-r">⚠️含链接</span> ':''}${esc(m.sender)}</span>
        <span class="time">${new Date(m.created_at).toLocaleString('zh-CN')}</span>
      </div>
      <div class="subj">${esc(m.subject||'(无主题)')}${m.is_read?'':' <span class="tag tag-b" style="margin-left:4px">新</span>'}</div>
    </div>`).join('');
}

// ========== 已发送 ==========
async function renderSent(){
  const {data}=await sb.from('mail_messages').select('*').eq('sender',me.username).eq('sender_deleted',false).order('created_at',{ascending:false});
  const list=data||[];
  if(!list.length){document.getElementById('main').innerHTML='<div class="empty">暂无已发送邮件</div>';return;}
  document.getElementById('main').innerHTML=list.map(m=>`
    <div class="msg-item" onclick="viewMessage(${m.id},'sent')">
      <div class="row">
        <span class="who">→ ${esc(m.recipient)} ${m.has_link?'<span class="tag tag-r">⚠️含链接</span>':''}</span>
        <span class="time">${new Date(m.created_at).toLocaleString('zh-CN')}</span>
      </div>
      <div class="subj">${esc(m.subject||'(无主题)')}</div>
    </div>`).join('');
}

async function viewMessage(id,folder){
  const {data:m}=await sb.from('mail_messages').select('*').eq('id',id).single();
  if(!m)return;
  if(folder==='inbox' && !m.is_read){
    await sb.from('mail_messages').update({is_read:true}).eq('id',id);
  }
  openModal((folder==='inbox'?'来自 ':'发给 ')+esc(folder==='inbox'?m.sender:m.recipient),`
    <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">${new Date(m.created_at).toLocaleString('zh-CN')}</div>
    <h4 style="font-size:15px;margin-bottom:10px">${esc(m.subject||'(无主题)')}</h4>
    <div style="background:#0f172a;border-radius:10px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap">${esc(m.body)}</div>
    ${m.has_link?'<div class="notice" style="margin-top:12px">⚠️ 此邮件含外部链接，已被系统标记。请勿随意点击陌生链接，谨防诈骗。</div>':''}
    <div style="display:flex;gap:8px;margin-top:14px">
      ${folder==='inbox'?`<button class="btn btn-primary" style="flex:1" onclick="replyTo('${esc(m.sender)}','${esc(m.subject)}')">回复</button>`:''}
      <button class="btn btn-ghost" style="flex:1" onclick="deleteMsg(${id},'${folder}')">删除</button>
    </div>
  `);
}

function replyTo(sender,subject){
  closeModal();
  switchTab('compose');
  setTimeout(()=>{
    document.getElementById('c-to').value=sender;
    document.getElementById('c-subject').value=subject.startsWith('Re:')?subject:'Re: '+subject;
    document.getElementById('c-body').focus();
  },100);
}

async function deleteMsg(id,folder){
  if(folder==='inbox')await sb.from('mail_messages').update({recipient_deleted:true}).eq('id',id);
  else await sb.from('mail_messages').update({sender_deleted:true}).eq('id',id);
  toast('已删除');
  closeModal();
  switchTab(folder);
}

// ========== 写邮件 ==========
function renderCompose(){
  document.getElementById('main').innerHTML=`
    <div class="card">
      <h3>✉️ 写邮件</h3>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:10px">收件人请填写本站用户名，系统会自动过滤外部链接。</div>
      <input class="input" id="c-to" placeholder="收件人（本站用户名）">
      <input class="input" id="c-subject" placeholder="主题">
      <textarea class="textarea" id="c-body" placeholder="邮件正文…"></textarea>
      <div id="link-warn" style="display:none;background:#450a0a;color:#f87171;padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px">⚠️ 检测到外部链接！站内邮箱禁止发送外部链接，请删除后再发送。</div>
      <button class="btn btn-primary" onclick="sendMail()">发送邮件</button>
    </div>`;
  document.getElementById('c-body').addEventListener('input',checkLink);
  document.getElementById('c-subject').addEventListener('input',checkLink);
}

function checkLink(){
  const body=document.getElementById('c-body').value;
  const subj=document.getElementById('c-subject').value;
  const has=hasExternalLink(body)||hasExternalLink(subj);
  document.getElementById('link-warn').style.display=has?'block':'none';
  return has;
}

async function sendMail(){
  const to=document.getElementById('c-to').value.trim();
  const subject=document.getElementById('c-subject').value.trim();
  const body=document.getElementById('c-body').value.trim();
  if(!to||!body){toast('请填写收件人和正文');return;}
  if(hasExternalLink(body)||hasExternalLink(subject)||hasExternalLink(to)){
    toast('❌ 禁止发送外部链接！已拦截');
    return;
  }
  await sb.from('mail_messages').insert({sender:me.username,recipient:to,subject,body,has_link:false});
  toast('✅ 邮件已发送');
  switchTab('sent');
}

// ========== 管理制度 ==========
function renderRules(){
  document.getElementById('main').innerHTML=`
    <div class="card">
      <h3>📜 站内邮箱管理制度</h3>
      <div class="rules">
        <ol>
          <li><b>仅限内部交流</b>：站内邮箱仅供本站注册用户之间交流使用，不得用于外部联络。</li>
          <li><b>严禁外部链接</b>：邮件内容中严禁包含任何外部网址、链接、二维码等，系统自动检测拦截。</li>
          <li><b>禁止违法违规</b>：不得发送违法、欺诈、骚扰、广告、暴力、色情等内容。</li>
          <li><b>保护个人信息</b>：不得在邮件中索要他人身份证、银行卡、密码等敏感信息。</li>
          <li><b>管理员监督</b>：邮箱管理员有权查阅违规邮件、警告、封禁违规用户。</li>
          <li><b>违规处理</b>：违反规定造成不良后果的，将严肃处理并追究责任，严重者永久封禁。</li>
          <li><b>共同维护</b>：发现违规邮件请及时向管理员举报，共同维护站内净土。</li>
        </ol>
      </div>
    </div>`;
}

// ========== 管理后台 ==========
async function renderAdmin(){
  if(!isAdmin){document.getElementById('main').innerHTML='<div class="empty">无权限</div>';return;}
  const {data:msgs}=await sb.from('mail_messages').select('*').order('created_at',{ascending:false}).limit(50);
  const flagged=(msgs||[]).filter(m=>m.has_link);
  document.getElementById('main').innerHTML=`
    <div class="card">
      <h3>🛡️ 管理后台</h3>
      <div style="font-size:13px;color:#cbd5e1">总邮件数：${(msgs||[]).length} · 含链接：${flagged.length}</div>
    </div>
    <div class="card">
      <h3>⚠️ 含外部链接邮件（重点审查）</h3>
      ${flagged.length?flagged.map(m=>`
        <div class="msg-item" onclick="adminView(${m.id})">
          <div class="row"><span class="who">${esc(m.sender)} → ${esc(m.recipient)}</span><span class="tag tag-r">含链接</span></div>
          <div class="subj">${esc(m.subject||'')}</div>
        </div>`).join(''):'<div class="empty">暂无违规邮件</div>'}
    </div>
    <div class="card">
      <h3>📋 全部邮件（最近50封）</h3>
      ${(msgs||[]).map(m=>`
        <div class="msg-item" onclick="adminView(${m.id})">
          <div class="row"><span class="who">${esc(m.sender)} → ${esc(m.recipient)}</span><span class="time">${new Date(m.created_at).toLocaleString('zh-CN')}</span></div>
          <div class="subj">${esc(m.subject||'')}${m.has_link?' <span class="tag tag-r">含链接</span>':''}</div>
        </div>`).join('')}
    </div>`;
}

async function adminView(id){
  const {data:m}=await sb.from('mail_messages').select('*').eq('id',id).single();
  openModal(`邮件 #${id}`,`
    <div class="meta" style="font-size:12px;color:#94a3b8;margin-bottom:8px">${esc(m.sender)} → ${esc(m.recipient)} · ${new Date(m.created_at).toLocaleString('zh-CN')}</div>
    <h4 style="margin-bottom:8px">${esc(m.subject||'')}</h4>
    <div style="background:#0f172a;border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14px">${esc(m.body)}</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-danger" style="flex:1" onclick="adminDelete(${m.id})">删除此邮件</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">关闭</button>
    </div>
  `);
}

async function adminDelete(id){
  await sb.from('mail_messages').delete().eq('id',id);
  toast('已删除违规邮件');
  closeModal();
  switchTab('admin');
}

// 启动
(async function init(){
  if(!SiteAuth.isLoggedIn()){
    document.getElementById('main').innerHTML='<div class="empty">请先登录后使用站内邮箱</div>';
    SiteAuth.requireLogin(async()=>{ me=await ensureMailUser(); loadAdminStatus(); await switchTab('inbox'); });
    return;
  }
  me=await ensureMailUser();
  document.getElementById('u-name').textContent='👤 '+me.username;
  loadAdminStatus();
  await switchTab('inbox');
})();

async function ensureMailUser(){
  const u=SiteAuth.getUser();
  const {data}=await sb.from('mu_users').select('*').eq('username',u.username).maybeSingle();
  return data||{username:u.username};
}
</script>
</body>
</html>
