<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 提示词市场 · 豆包 / 扣子 / 千问 · zhongguogit</title>
<meta name="description" content="按工具分类的 AI 提示词、语音口令、Skill 包市场。免费层直接复制，付费层扫码即得。任何人都能上架，平台只收 3%。">
<style>
:root{--bg:#f7f8fa;--card:#fff;--line:#e5e7eb;--line2:#d1d5db;--tx:#111827;--tx2:#4b5563;--tx3:#9ca3af;
  --brand:#2563eb;--brand2:#1d4ed8;--ok:#059669;--warn:#d97706;--bad:#dc2626;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a{color:var(--brand)}

nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
nav .wrap{display:flex;align-items:center;height:58px;gap:18px}
.brand{font-weight:650;font-size:15px}
.brand span{color:var(--brand)}
.navlinks{margin-left:auto;display:flex;gap:18px;font-size:14px;align-items:center}
.navlinks a{color:var(--tx2);text-decoration:none}
.navlinks a:hover{color:var(--tx)}
.navlinks .sell{background:var(--brand);color:#fff;padding:7px 15px;border-radius:8px;font-weight:600}
.navlinks .sell:hover{background:var(--brand2)}

header{padding:46px 0 28px;text-align:center}
header h1{font-size:clamp(25px,3.6vw,36px);letter-spacing:-.02em;line-height:1.3}
header p{color:var(--tx2);font-size:16px;margin-top:12px;max-width:640px;margin-left:auto;margin-right:auto}
.fee{display:inline-flex;gap:8px;align-items:center;margin-top:16px;font-size:13.5px;
  background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:9px 16px}
.fee b{font-size:18px;font-family:var(--mono)}

/* 搜索 + 分类 */
.toolbar{margin:22px 0 16px}
.searchrow{display:flex;gap:10px;margin-bottom:14px}
.searchrow input{flex:1;padding:12px 15px;border:1px solid var(--line2);border-radius:10px;
  font-size:14.5px;outline:none;background:#fff}
.searchrow input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:7px 15px;
  font-size:13.5px;cursor:pointer;color:var(--tx2);transition:.15s;font-family:inherit}
.cat:hover{border-color:var(--line2)}
.cat.on{background:var(--tx);color:#fff;border-color:var(--tx)}
#catDesc{font-size:13px;color:var(--tx3);margin-top:10px;min-height:20px}
#stat{font-size:13px;color:var(--tx3);margin-bottom:12px}

/* 商品网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:40px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;
  cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.item:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08);border-color:var(--line2)}
.it-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.plat{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600}
.plat.doubao{background:#eef2ff;color:#4338ca}
.plat.kouzi{background:#f0fdf4;color:#15803d}
.plat.qwen{background:#f0f9ff;color:#0369a1}
.plat.agent{background:#fdf4ff;color:#a21caf}
.plat.voice{background:#fff7ed;color:#c2410c}
.plat.skill{background:#f5f3ff;color:#6d28d9}
.sales{font-size:11.5px;color:var(--tx3)}
.item h3{font-size:15.5px;line-height:1.45;margin-bottom:7px}
.item .sum{font-size:13px;color:var(--tx2);line-height:1.6;flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.it-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line)}
.price{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--brand)}
.btn-sm{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;
  padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
.btn-sm:hover{background:var(--brand);color:#fff}
.empty{grid-column:1/-1;text-align:center;color:var(--tx3);font-size:14px;padding:50px 20px;line-height:2}

/* 卖家入口条 */
.sellbar{background:#111827;color:#fff;border-radius:14px;padding:22px 26px;margin:20px 0 40px;
  display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.sellbar h3{font-size:17px;margin-bottom:4px}
.sellbar p{font-size:13.5px;color:#d1d5db;line-height:1.6}
.sellbar .go{margin-left:auto;background:#fff;color:#111827;padding:11px 22px;border-radius:9px;
  text-decoration:none;font-weight:650;font-size:14px;white-space:nowrap}
.sellbar .go:hover{background:#f3f4f6}

/* 弹层 */
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.box{background:#fff;border-radius:16px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative}
.box .close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:24px;color:var(--tx3);cursor:pointer}
.box h3{font-size:19px;line-height:1.4;margin-bottom:5px;padding-right:26px}
#dMeta{font-size:12.5px;color:var(--tx3);margin-bottom:18px}
.free,.pro{border-radius:11px;padding:15px;margin-bottom:14px}
.free{background:#f0fdf4;border:1px solid #bbf7d0}
.pro{background:#eff6ff;border:1px solid #bfdbfe}
.free-h{font-size:13.5px;font-weight:650;margin-bottom:8px}
.free pre{white-space:pre-wrap;font-family:var(--sans);font-size:13px;line-height:1.75;
  color:#166534;background:#fff;border-radius:8px;padding:12px;max-height:200px;overflow:auto}
.cp2{width:100%;margin-top:9px;padding:9px;border-radius:8px;border:1px solid #059669;
  background:#fff;color:#059669;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cp2:hover{background:#059669;color:#fff}
.pro-body{font-size:13px;color:#1e40af;line-height:1.8;white-space:pre-wrap}
.fail{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:12px;
  font-size:12.5px;color:#92400e;line-height:1.7;margin-bottom:14px}
.sellinfo{font-size:12px;color:var(--tx3);margin-bottom:16px}
.buy{width:100%;padding:13px;border-radius:9px;border:none;background:var(--brand);color:#fff;
  font-size:15px;font-weight:650;cursor:pointer;font-family:inherit}
.buy:hover{background:var(--brand2)}
.buy-note{font-size:12px;color:var(--tx3);text-align:center;margin-top:9px;line-height:1.6}

footer{padding:30px 0;text-align:center;color:var(--tx3);font-size:13px;border-top:1px solid var(--line)}
footer a{color:var(--tx2)}
@media(max-width:600px){.sellbar .go{margin-left:0;width:100%;text-align:center}}
</style>
</head>

    <p>豆包擅长口语、扣子擅长编排、千问擅长长文。同一个任务，三家写法完全不同——

<script src="/pay/config.js"></script>
<script src="/market/config.js"></script>

</body>
</html>
