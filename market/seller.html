<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卖家后台 · AI 提示词市场</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;
  --brand:#6366f1;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.6;padding:20px;min-height:100vh}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--tx2);font-size:13px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px}
.gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#0f172a;
  color:var(--tx);font-size:15px;font-family:var(--mono);letter-spacing:.15em;outline:none;margin-bottom:12px;text-align:center}
button{cursor:pointer;font-family:inherit;border:none;border-radius:9px;font-size:14px;font-weight:600;padding:11px 20px}
.primary{background:var(--brand);color:#fff;width:100%}
.primary:hover{opacity:.9}
.err{color:#fca5a5;font-size:13px;margin-top:10px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.st b{display:block;font-size:20px;font-family:var(--mono);line-height:1.3}
.st span{font-size:11px;color:var(--tx3)}
.mine{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px}
.mine-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mine-id{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.badge{font-size:11px;padding:2px 9px;border-radius:20px}
.b-review{background:#422006;color:#fbbf24;border:1px solid #78350f}
.b-live{background:#052e1a;color:#34d399;border:1px solid #065f46}
.b-offline{background:#3f1d1d;color:#fca5a5;border:1px solid #7f1d1d}
.mine h3{font-size:15px;margin-bottom:4px}
.mine .meta{font-size:12.5px;color:var(--tx2)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--tx3);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tbl td.n{font-family:var(--mono);text-align:right}
.tbl tr:last-child td{border-bottom:none}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:26px 10px;line-height:1.9}
h2{font-size:15px;margin-bottom:12px}
code{background:#0f172a;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:12px;color:#a5b4fc}
footer{text-align:center;color:var(--tx3);font-size:12px;padding:16px 0}
footer a{color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏪 卖家后台</h1>
  <div class="sub">看我的商品状态、成交、平台抽成和该到手多少。</div>

  <div class="card gate" id="gate">
    <input id="pin" placeholder="输入口令（字母+数字）" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button class="primary" id="btnLogin">进入</button>
    <div class="err" id="pinErr"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <h2>查我的商品</h2>
      <div id="mineList"><div class="empty">输入卖家联系方式后显示</div></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="who" placeholder="你上架时填的联系方式" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#0f172a;color:var(--tx);font-size:14px;outline:none">
        <button class="primary" style="width:auto;padding:10px 20px" id="btnMine">查</button>
      </div>
    </div>

    <div class="stats">
      <div class="st"><b id="sOrders" style="color:#34d399">0</b><span>已成交</span></div>
      <div class="st"><b id="sGross" style="color:#e2e8f0">¥0</b><span>成交额</span></div>
      <div class="st"><b id="sFee" style="color:#fbbf24">¥0</b><span>平台服务费 3%</span></div>
      <div class="st"><b id="sNet" style="color:#34d399">¥0</b><span>你应到手</span></div>
    </div>

    <div class="card">
      <h2>成交明细</h2>
      <div id="orderBox"><div class="empty">加载中…</div></div>
    </div>
  </div>

  <footer>
    卖家口令在 <code>/market/config.js</code> 的 <code>sellerPin</code> ·
    <a href="/market/">← 市场</a>
  </footer>
</div>

<script src="/pay/config.js"></script>
<script src="/market/config.js"></script>
<script src="/market/seller.js"></script>
</body>
</html>
