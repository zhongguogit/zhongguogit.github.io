<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小群 · 我的空间我做主</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a24;--panel2:#1e2330;--line:#2a2f40;--text:#e8eaf0;--muted:#8b91a5;--accent:#5b8cff;--gold:#d4a94e;--ok:#3ecf8e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px}
  header .sub{font-size:11px;color:var(--muted)}
  header a{margin-left:auto;font-size:12px;color:var(--accent)}
  #chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
  .sys{align-self:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;text-align:center;max-width:92%}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:3px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .who{font-size:10px;color:var(--muted);padding:0 6px}
  .bubble{padding:9px 13px;border-radius:13px;font-size:13px;line-height:1.6}
  .me .bubble{background:var(--accent);border-top-right-radius:4px}
  .other .bubble{background:var(--panel2);border:1px solid var(--line);border-top-left-radius:4px}
  footer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel)}
  .row{display:flex;gap:10px;max-width:760px;margin:0 auto}
  input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none}
  .btn{padding:11px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
  .setup{max-width:420px;margin:10vh auto;background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:26px;text-align:center}
  .setup h2{font-size:17px;color:var(--gold);margin-bottom:8px}
  .setup p{font-size:12px;color:var(--muted);line-height:1.9;margin-bottom:16px}
  .setup input{width:100%;margin-bottom:10px;text-align:center}
  .setup .btn{width:100%}
  .invite{display:none;margin-top:14px;padding:12px;border:1px solid var(--ok);border-radius:12px;font-size:12px;line-height:1.9}
  .invite b{color:var(--ok)}
  .invite input{margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🏠 <span id="gName">我的小群</span></h1>
  <span class="sub" id="gCode"></span>
  <a href="/">← 返回本站</a>
</header>

<div id="chat"></div>

<footer id="foot" style="display:none">
  <div class="row"><input id="inp" placeholder="和小群伙伴聊点什么…" autocomplete="off"><button class="btn" onclick="send()">发送</button></div>
</footer>

<div class="setup" id="setup">
  <h2>🏠 建立我的小群</h2>
  <p>你的私人空间：起个群名，生成专属邀请链接，<br>把朋友拉进来随时聊。群消息真实保存，随时回来看。</p>
  <input id="gTitle" placeholder="群名称（如：老王的朋友圈）">
  <input id="meName" placeholder="你的昵称">
  <button class="btn" onclick="createGroup()">🚀 创建我的群</button>
  <div style="font-size:11px;color:var(--muted);margin-top:12px">已有邀请链接？直接在链接打开即可入群</div>
</div>

<script src="/site-db.js"></script>
<script>
const qs=new URLSearchParams(location.search);
const GC=qs.get('g');
const chat=document.getElementById('chat');

function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function scroll(){chat.scrollTop=1e9;}
function sys(t){chat.appendChild(el(`<div class="sys">${t}</div>`));scroll();}

if(GC){
  setup.style.display='none';foot.style.display='block';
  document.getElementById('gCode').textContent='群号 '+GC;
  sys('👋 欢迎来到小群！消息已保存，伙伴随时进来看得到');
  loadMsgs();setInterval(loadMsgs,5000); // 5 秒拉新消息
}else{
  foot.remove();
}

async function loadMsgs(){
  try{
    const rows=await sbSelect('group_msgs?group_code=eq.'+GC,'created_at.asc',50);
    const known=new Set([...chat.querySelectorAll('.msg')].map(m=>m.dataset.id));
    rows.forEach(r=>{
      if(known.has(String(r.id)))return;
      const me=sessionStorage.getItem('zg_myname')===r.who;
      const m=el(`<div class="msg ${me?'me':'other'}" data-id="${r.id}"><div class="who">${r.who}</div><div class="bubble">${String(r.txt).replace(/</g,'&lt;')}</div></div>`);
      chat.appendChild(m);scroll();
    });
  }catch(e){}
}

async function createGroup(){
  const name=gTitle.value.trim()||'我的小群', me=meName.value.trim()||'群主';
  const code='G'+Math.random().toString(36).slice(2,8).toUpperCase();
  await sbInsert('groups',{group_code:code,name,owner:me}).catch(e=>{});
  sessionStorage.setItem('zg_myname',me);
  location.href=location.pathname+'?g='+code;
}

async function send(){
  const t=inp.value.trim();if(!t)return;inp.value='';
  const who=sessionStorage.getItem('zg_myname')||'访客';
  await sbInsert('group_msgs',{group_code:GC,who,txt:t}).catch(e=>{});
  loadMsgs();
}
inp&&inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
