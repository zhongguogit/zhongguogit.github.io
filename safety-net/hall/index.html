<section class="hall wrap">
  <p class="eyebrow">◐ 学习大厅 · 开荒地图</p>
  <h1 class="s2">学完的那一格，得在哪儿留下一道印。</h1>
  <p class="muted hall-intro">
    下面都是活的。点“接这一格”，它会变成你卡面上的一盏灯——
    但你不用交作业，也不用解释为什么停。<b>做不动就歇着，它还在。</b>
  </p>

  <div class="tabs" role="tablist" aria-label="大厅分区">
    <button class="tab on" type="button" id="tab-a" role="tab" aria-selected="true" aria-controls="a" data-t="a">🎓 三轨课 · 接一格</button>
    <button class="tab" type="button" id="tab-b" role="tab" aria-selected="false" aria-controls="b" tabindex="-1" data-t="b">🜂 无人区地图 · 去踩第一脚</button>
  </div>

  <!-- 课程 -->
  <div class="panel on" id="a" role="tabpanel" aria-labelledby="tab-a">
    <div class="cards" id="lessons"></div>
    <p class="empty" id="doneMsg" role="status" hidden>三盏都亮了。你卡面上现在刻着：<b class="done-hl">走过这三格的人</b>。<br>想再来，就往无人区走一步 ↓</p>
  </div>

  <!-- 开荒 -->
  <div class="panel" id="b" role="tabpanel" aria-labelledby="tab-b">
    <div class="map" id="frontiers"></div>
    <p class="empty">占格不是抢地盘。是给这片起个名、画条边界。<br>90 天后它要么长成域，要么位子让出去——<b>你的署名，一直都在。</b></p>
  </div>
