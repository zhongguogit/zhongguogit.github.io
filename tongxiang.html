<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 全球老乡群 · 进站即入群</title>
<style>
  :root{--bg:#0d0f14;--panel:#161a24;--panel2:#1e2330;--line:#2a2f40;--text:#e8eaf0;--muted:#8b91a5;--accent:#5b8cff;--gold:#d4a94e;--ok:#3ecf8e;--warn:#ffb454}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:15px}
  .tag{font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:2px 8px}
  header a{margin-left:auto;font-size:12px;color:var(--accent)}
  .notice{max-width:760px;margin:10px auto 0;width:calc(100%-40px);padding:7px 12px;font-size:11px;color:var(--warn);background:rgba(255,180,84,.07);border:1px solid rgba(255,180,84,.35);border-radius:10px}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;max-width:760px;width:100%;margin:0 auto}
  .sys{align-self:center;font-size:11px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;text-align:center;max-width:92%}
  .msg{max-width:80%;display:flex;flex-direction:column;gap:3px}
  .msg.me{align-self:flex-end;align-items:flex-end}
  .who{font-size:10px;color:var(--muted);padding:0 6px}
  .bubble{padding:8px 12px;border-radius:13px;font-size:13px;line-height:1.6;word-break:break-all}
  .me .bubble{background:var(--accent);border-top-right-radius:4px}
  .other .bubble{background:var(--panel2);border:1px solid var(--line);border-top-left-radius:4px}
  footer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel)}
  .row{display:flex;gap:10px;max-width:760px;margin:0 auto}
  input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;outline:none}
  .btn{padding:11px 20px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>🌌 全球老乡群 · 星际联盟交流场</h1>
  <span class="tag">进站即入群</span>
  <span class="tag" style="color:var(--gold);border-color:var(--gold)">🌠 星星来客 · 未来公民</span>
  <a href="/">← 返回本站</a>
</header>

<div class="notice">⚠️ 公开群，所有人可见，请文明交流；广告、刷屏会被诚意分机制请离 · 发言代表个人</div>

<div id="chat"></div>

<footer>
  <div class="row" id="chatRow" style="display:none">
    <input id="inp" placeholder="和全球老乡打个招呼…" autocomplete="off">
    <button class="btn" onclick="send()">发送</button>
  </div>
  <div class="row" id="joinRow">
    <input id="nick" placeholder="输入你的昵称（带地区更好，如：北京·小张）">
    <button class="btn" onclick="join()">🌍 进群</button>
  </div>
</footer>

<script src="/site-db.js"></script>
<script>
const GC='GLOBAL-XIANGQIN';
let curGC=GC;
const chat=document.getElementById('chat');
let myNick=sessionStorage.getItem('zg_tongxiang')||'';

function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function scroll(){chat.scrollTop=1e9;}
function sys(t){chat.appendChild(el(`<div class="sys">${t}</div>`));scroll();}

const CAP=200;
async function memberCount(code){
  try{const rows=await sbSelect('group_members?group_code=eq.'+code,'created_at.desc',1000);return rows.length}catch(e){return 0}
}
async function join(){
  const n=nick.value.trim();if(!n)return alert('请输入昵称');
  // 满 200 人自动顺延下一个群
  let code=GC,idx=1;
  while(await memberCount(code)>=CAP){idx++;code=GC+'-'+idx;}
  window.__GC=code;
  myNick=n;sessionStorage.setItem('zg_tongxiang',n);
  sessionStorage.setItem('zg_tongxiang_gc',code);
  joinRow.style.display='none';chatRow.style.display='flex';
  const no=idx>1?`（${idx} 群）`:'';
  sys(`🌠 欢迎 <b style="color:var(--gold)">${n.replace(/</g,'&lt;')}</b> 抵达星际联盟交流场${no}！当前舱位 <b>${await memberCount(code)+1}</b>/${CAP}——来自星星的公民，请以未来语言打个招呼`);
  try{await sbInsert('group_members',{group_code:code,nick:n})}catch(e){}
  sbInsert('group_msgs',{group_code:code,who:'🌍群管家',txt:`🌠 星际联盟播报：${n} 已抵达交流场${no}——未来的公民，你的技能已记录在案`}).catch(()=>{});
  loadMsgs();
}

const known=new Set();
async function loadMsgs(){
  try{
    const rows=await sbSelect('group_msgs?group_code=eq.'+curGC,'created_at.asc',50);
    rows.forEach(r=>{
      if(known.has(String(r.id)))return;known.add(String(r.id));
      const me=r.who===myNick;
      chat.appendChild(el(`<div class="msg ${me?'me':'other'}" data-id="${r.id}"><div class="who">🛰️ ${String(r.who).replace(/</g,'&lt;')} · <span style="color:#a06bf0">星际公民</span></div><div class="bubble">${String(r.txt).replace(/</g,'&lt;')}</div></div>`));
      scroll();
    });
  }catch(e){}
}

async function send(){
  const t=inp.value.trim();if(!t)return;inp.value='';
  await sbInsert('group_msgs',{group_code:(window.__GC||sessionStorage.getItem('zg_tongxiang_gc')||GC),who:myNick,txt:t}).catch(()=>{});
  loadMsgs();
}
inp&&inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});

sys('🌍 全球老乡群 · 来自世界各地的朋友在这里相聚：聊家乡、聊痛点、聊生意，也聊前沿纠错');
if(myNick){nick.value=myNick;curGC=sessionStorage.getItem('zg_tongxiang_gc')||GC;join();}
else{loadMsgs();setInterval(loadMsgs,5000);}
</script>

<div id="gasBar" style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:97;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#d4a94e,#b8862e);color:#111;padding:9px 18px;border-radius:24px;font-size:12px;font-weight:700;box-shadow:0 6px 22px rgba(212,169,78,.45);cursor:pointer;animation:bob 2.6s ease-in-out infinite" onclick="location.href='/gas.html'">
  ⛽ 上滑找加油机 · ¥3/百万token ‖ 🧰 工具机 · 0 元起 · 先到先得
</div>
<style>@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}</style>
</body>
</html>
