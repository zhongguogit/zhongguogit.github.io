<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="UMIT · 能力网络：能力必须装在智能体身上，谁干活钱归谁。静态演示版。" />
<title>UMIT · 能力网络（演示版）</title>
<style>
:root {
  --bg: #070b12;
  --bg-2: #0b111b;
  --card: #101826;
  --card-2: #0e1622;
  --line: rgba(255, 255, 255, 0.07);
  --line-2: rgba(255, 255, 255, 0.12);
  --text: #e9f0f8;
  --dim: #8899ad;
  --dim-2: #5f7188;
  --mint: #2ee6c5;
  --mint-dark: #0f6e62;
  --blue: #6aa6ff;
  --warn: #ffb454;
  --danger: #ff6b6b;
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(46, 230, 197, 0.10), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(106, 166, 255, 0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font-family: inherit; }

.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

/* ---------------- 侧边栏 ---------------- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 24px 18px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(12, 19, 30, 0.96), rgba(7, 11, 18, 0.96));
  backdrop-filter: blur(12px);
}

.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.logo {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 800; font-size: 18px; color: #04120f;
  background: linear-gradient(135deg, var(--mint), #79f3dd);
  box-shadow: 0 0 24px rgba(46, 230, 197, 0.35);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text b { letter-spacing: 2px; font-size: 15px; }
.brand-text span { font-size: 11px; color: var(--dim); letter-spacing: 1px; }

#nav { display: flex; flex-direction: column; gap: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--dim);
  padding: 11px 12px;
  border-radius: 11px;
  font-size: 13px;
  cursor: pointer;
  text-align: left;
  transition: 0.18s;
}
.nav-item i { font-style: normal; width: 16px; text-align: center; opacity: 0.8; }
.nav-item:hover { color: var(--text); background: rgba(255, 255, 255, 0.035); }
.nav-item.active {
  color: var(--mint);
  background: rgba(46, 230, 197, 0.08);
  border-color: rgba(46, 230, 197, 0.22);
}

.side-note {
  margin-top: auto;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, rgba(46, 230, 197, 0.07), rgba(106, 166, 255, 0.04));
}
.side-note-title { font-size: 11px; letter-spacing: 1px; color: var(--mint); margin-bottom: 6px; }
.side-note p { margin: 0; font-size: 11.5px; color: var(--dim); line-height: 1.7; }
.side-tag {
  margin-top: 10px; display: inline-block;
  font-size: 11px; color: var(--text);
  padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--line-2);
}
.side-foot { font-size: 10px; color: var(--dim-2); letter-spacing: 0.5px; padding: 0 6px; }

/* ---------------- 主区域 ---------------- */
.main { padding: 22px 28px 60px; max-width: 1320px; width: 100%; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 22px;
}
.crumb { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.crumb-sub { font-size: 12px; color: var(--dim); margin-top: 1px; }
.top-right { display: flex; align-items: center; gap: 10px; }
.balance-pill {
  font-size: 12px; color: var(--mint);
  border: 1px solid rgba(46, 230, 197, 0.25);
  background: rgba(46, 230, 197, 0.06);
  padding: 7px 12px; border-radius: 999px;
  white-space: nowrap;
}
.me {
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #26364d, #1a2536);
  border: 1px solid var(--line-2);
  font-size: 12px; color: var(--text);
}

/* ---------------- 通用 ---------------- */
.card {
  background: linear-gradient(165deg, rgba(17, 26, 40, 0.92), rgba(12, 18, 28, 0.92));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.card-title { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
.card-sub { margin: 5px 0 0; font-size: 12px; color: var(--dim); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 16px; margin-bottom: 16px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.divider { height: 1px; background: var(--line); }
.tiny { font-size: 11px; }
.dim { color: var(--dim); }
.accent { color: var(--mint); }

/* ---------------- 按钮 / 标签 ---------------- */
.btn {
  border: 1px solid var(--line-2);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 10px;
  font-size: 12.5px;
  cursor: pointer;
  transition: 0.16s;
  white-space: nowrap;
}
.btn:hover { border-color: rgba(46, 230, 197, 0.45); color: var(--mint); }
.btn.primary {
  background: linear-gradient(135deg, var(--mint), #55f0d5);
  border-color: transparent; color: #04231d; font-weight: 700;
  box-shadow: 0 6px 22px rgba(46, 230, 197, 0.22);
}
.btn.primary:hover { filter: brightness(1.06); color: #04231d; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: rgba(255, 107, 107, 0.3); background: transparent; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 6px 11px; font-size: 11.5px; border-radius: 8px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line-2); color: var(--text); }

.chip {
  display: inline-flex; align-items: center;
  font-size: 10.5px; color: var(--dim);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  padding: 3px 8px; border-radius: 999px;
  white-space: nowrap;
}
button.chip { cursor: pointer; color: var(--dim); }
button.chip:hover { color: var(--mint); border-color: rgba(46, 230, 197, 0.4); }
.chip.accent { color: var(--mint); border-color: rgba(46, 230, 197, 0.3); background: rgba(46, 230, 197, 0.07); }
.chip.blue { color: var(--blue); border-color: rgba(106, 166, 255, 0.3); background: rgba(106, 166, 255, 0.07); }
.chip.warn { color: var(--warn); border-color: rgba(255, 180, 84, 0.3); background: rgba(255, 180, 84, 0.07); }

/* ---------------- Hero ---------------- */
.hero { margin-bottom: 18px; }
.hero h1 {
  margin: 0;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.25;
  letter-spacing: -0.5px;
  background: linear-gradient(100deg, #ffffff 20%, #8ff5e3 70%, #8dbaff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { margin: 8px 0 0; color: var(--dim); font-size: 13px; max-width: 760px; }
.rule-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.rule-pill {
  font-size: 11.5px; color: var(--dim);
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
}
.rule-pill b { color: var(--text); font-weight: 600; margin-right: 4px; }

/* ---------------- 统计 ---------------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { padding: 16px 18px; border-radius: 15px; }
.stat-label { font-size: 11px; color: var(--dim); letter-spacing: 0.5px; }
.stat-value { font-size: 26px; font-weight: 750; letter-spacing: -0.5px; margin-top: 4px; }
.stat-value small { font-size: 11px; color: var(--dim); font-weight: 500; margin-left: 4px; }
.stat-foot { font-size: 10.5px; color: var(--dim-2); margin-top: 3px; }

/* ---------------- 表单 ---------------- */
.input {
  width: 100%;
  background: rgba(6, 10, 16, 0.72);
  border: 1px solid var(--line-2);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12.5px;
  outline: none;
  transition: 0.16s;
}
.input:focus { border-color: rgba(46, 230, 197, 0.55); box-shadow: 0 0 0 3px rgba(46, 230, 197, 0.08); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.65; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 11px; color: var(--dim); }
.draft-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.draft-grid .full { grid-column: 1 / -1; }

.confidence { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
.confidence-bar { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
.confidence-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), var(--blue)); border-radius: 99px; }
.confidence-val { font-size: 11px; color: var(--mint); white-space: nowrap; }
.evidence { display: flex; flex-wrap: wrap; gap: 6px; }
.warning-list {
  margin-top: 8px; font-size: 11px; color: var(--warn);
  background: rgba(255, 180, 84, 0.06);
  border: 1px solid rgba(255, 180, 84, 0.18);
  border-radius: 9px; padding: 8px 10px;
}

/* ---------------- 智能体 ---------------- */
.agent-card { padding: 18px; }
.agent-head { display: flex; gap: 11px; align-items: flex-start; }
.avatar {
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 700; font-size: 16px; color: #05120f;
  flex: none;
}
.agent-name { font-size: 14px; font-weight: 700; }
.agent-line { font-size: 11.5px; color: var(--dim); margin-top: 1px; }
.agent-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.cap-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.cap-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid var(--line);
}
.cap-name { font-size: 12px; font-weight: 600; }
.cap-tags { font-size: 10px; color: var(--dim); margin-top: 1px; }
.cap-price { font-size: 12px; color: var(--mint); font-weight: 700; white-space: nowrap; }

/* ---------------- 撮合 ---------------- */
.match-card {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  padding: 14px; border-radius: 13px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.022);
}
.score-ring {
  --p: 80;
  width: 52px; height: 52px; border-radius: 50%;
  display: grid; place-items: center;
  background: conic-gradient(var(--mint) calc(var(--p) * 1%), rgba(255, 255, 255, 0.07) 0);
  position: relative;
}
.score-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #0d1522; }
.score-ring span { position: relative; z-index: 1; font-size: 13px; font-weight: 700; color: var(--mint); }
.reason-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }

/* ---------------- 订单 ---------------- */
.tabs { display: flex; gap: 6px; }
.tab {
  background: transparent; border: 1px solid var(--line);
  color: var(--dim); font-size: 12px;
  padding: 7px 14px; border-radius: 999px; cursor: pointer;
}
.tab.on { color: var(--mint); border-color: rgba(46, 230, 197, 0.35); background: rgba(46, 230, 197, 0.08); }

.order-card {
  padding: 14px; border-radius: 13px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.022);
  transition: 0.16s;
}
.order-card[data-action] { cursor: pointer; }
.order-card[data-action]:hover { border-color: var(--line-2); background: rgba(255, 255, 255, 0.035); }
.order-card.active { border-color: rgba(46, 230, 197, 0.4); background: rgba(46, 230, 197, 0.045); }
.order-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.order-name { font-size: 13px; font-weight: 650; }
.order-desc { font-size: 11.5px; color: var(--dim); margin-top: 6px; line-height: 1.6; }
.order-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 8px; font-size: 10px; color: var(--dim-2);
}
.countdown { font-family: "SF Mono", ui-monospace, monospace; color: var(--warn); font-size: 12px; font-weight: 700; }
.countdown.urgent { color: var(--danger); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.45; } }
.order-card .row[style*="margin-top"] { margin-top: 10px; }

.status {
  font-size: 10px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid var(--line-2); color: var(--dim); white-space: nowrap;
}
.status.pending_owner { color: var(--warn); border-color: rgba(255, 180, 84, 0.35); background: rgba(255, 180, 84, 0.07); }
.status.human_running { color: var(--blue); border-color: rgba(106, 166, 255, 0.35); background: rgba(106, 166, 255, 0.07); }
.status.agent_running { color: var(--mint); border-color: rgba(46, 230, 197, 0.35); background: rgba(46, 230, 197, 0.07); }
.status.delivered { color: #c7a6ff; border-color: rgba(199, 166, 255, 0.35); background: rgba(199, 166, 255, 0.07); }
.status.settled { color: #9fe7b8; border-color: rgba(159, 231, 184, 0.3); }
.status.disputed, .status.cancelled { color: var(--danger); border-color: rgba(255, 107, 107, 0.3); }

.timeline { display: flex; flex-direction: column; gap: 12px; }
.tl-item { display: grid; grid-template-columns: 10px 1fr; gap: 10px; }
.tl-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim-2); margin-top: 6px; }
.tl-item.agent .tl-dot { background: var(--mint); box-shadow: 0 0 10px rgba(46, 230, 197, 0.55); }
.tl-item.buyer .tl-dot { background: var(--blue); }
.tl-item.system .tl-dot { background: var(--warn); }
.tl-text { font-size: 11.5px; line-height: 1.6; }
.tl-time { font-size: 10px; color: var(--dim-2); margin-top: 1px; }

.artifact {
  white-space: pre-wrap;
  font-family: "SF Mono", ui-monospace, monospace;
  font-size: 11px; line-height: 1.75;
  background: rgba(5, 9, 15, 0.75);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  max-height: 360px;
  overflow: auto;
  color: #b9c8da;
}

.split-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.split-item { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02); }
.split-label { font-size: 10px; color: var(--dim); }
.split-val { font-size: 15px; font-weight: 700; margin-top: 2px; }
.split-val.accent { color: var(--mint); }

/* ---------------- 钱包 ---------------- */
.wallet-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.wallet-card { padding: 18px; border-radius: 16px; }
.wallet-card.big .stat-value { font-size: 32px; }
.ledger { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ledger th {
  text-align: left; font-weight: 500; color: var(--dim-2);
  font-size: 10px; letter-spacing: 0.5px;
  padding: 8px 10px; border-bottom: 1px solid var(--line);
}
.ledger td { padding: 9px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.045); color: var(--dim); }
.ledger td:last-child { color: var(--dim); }
.ledger .amount { font-family: "SF Mono", ui-monospace, monospace; white-space: nowrap; }
.ledger .amount.pos { color: var(--mint); }
.ledger .amount.neg { color: #ff9c9c; }
.ledger .amount.zero { color: var(--dim); }

/* ---------------- 空状态 ---------------- */
.empty {
  padding: 26px 18px; text-align: center;
  border: 1px dashed var(--line-2); border-radius: 12px;
  color: var(--dim-2); font-size: 11.5px;
  background: rgba(255, 255, 255, 0.012);
}
.empty b { font-weight: 500; color: var(--dim); }

/* ---------------- 弹窗 / Toast ---------------- */
#modal-root { display: none; }
#modal-root.on {
  display: grid; place-items: center;
  position: fixed; inset: 0; z-index: 50;
  background: rgba(3, 6, 11, 0.72);
  backdrop-filter: blur(6px);
  padding: 20px;
}
.modal {
  width: 100%; max-width: 480px;
  background: linear-gradient(170deg, #131d2c, #0c1420);
  border: 1px solid var(--line-2);
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
  animation: pop 0.18s ease-out;
}
@keyframes pop { from { transform: translateY(8px) scale(0.98); opacity: 0; } }
.modal h3 { margin: 0 0 6px; font-size: 17px; }
.modal-sub { font-size: 12px; color: var(--dim); margin: 0 0 16px; line-height: 1.7; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

.toast {
  position: fixed; left: 50%; bottom: 28px;
  transform: translate(-50%, 14px);
  background: #14202f; color: var(--text);
  border: 1px solid rgba(46, 230, 197, 0.3);
  border-radius: 10px; padding: 10px 16px;
  font-size: 12px; opacity: 0; pointer-events: none;
  transition: 0.22s; z-index: 80;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
  max-width: 86vw;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { border-color: rgba(255, 107, 107, 0.4); color: #ffd2d2; }

/* ---------------- 响应式 ---------------- */
@media (max-width: 1080px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: static; height: auto; flex-direction: row; align-items: center;
    padding: 14px 16px; gap: 14px; overflow-x: auto;
  }
  #nav { flex-direction: row; gap: 4px; }
  .nav-item { padding: 8px 11px; }
  .side-note, .side-foot { display: none; }
  .main { padding: 16px; }
  .grid-2 { grid-template-columns: 1fr; }
  .wallet-grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: 1fr; }
  .match-card { grid-template-columns: 52px 1fr; }
  .match-card .btn { grid-column: 1 / -1; width: 100%; }
}
@media (max-width: 520px) {
  .draft-grid { grid-template-columns: 1fr; }
  .split-box { grid-template-columns: 1fr; }
  .brand-text { display: none; }
}

.demo-strip {
  margin: 10px 16px 0;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(46, 230, 197, .08);
  border: 1px solid rgba(46, 230, 197, .22);
  color: #8ff3e2;
  font-size: 11px;
  line-height: 1.5;
}
.demo-strip b { color: #2ee6c5; }
.demo-strip button {
  margin-top: 6px;
  width: 100%;
  padding: 5px 8px;
  border-radius: 7px;
  border: 1px solid rgba(46, 230, 197, .3);
  background: transparent;
  color: #8ff3e2;
  font-size: 11px;
  cursor: pointer;
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">U</div>
        <div class="brand-text"><b>UMIT</b><span>能力网络</span></div>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="home"><i>⌂</i>我的家</button>
        <button class="nav-item" data-view="network"><i>◍</i>能力网络</button>
        <button class="nav-item" data-view="orders"><i>▤</i>订单</button>
        <button class="nav-item" data-view="wallet"><i>◈</i>钱包</button>
      </nav>

      <div class="side-note">
        <div class="side-note-title">平台的底线</div>
        <p>能力必须真的装在智能体身上。<br/>它做不出来，就不能发布，也不能接单。</p>
        <div class="side-tag">谁干活，钱归谁</div>
      </div>

      <div class="demo-strip">

  const ALL_KEYWORDS = TYPES.flatMap((t) => t.keywords);

  function normalize(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[\u3000\s]+/g, ' ')
      .replace(/[，。！？；：、,.!?;:()（）\[\]【】"'“”‘’]/g, ' ')
      .trim();
  }

  function cleanTitle(text) {
    const first = String(text || '')
      .split(/[。！？\n；;，,]/)[0]
      .replace(/^(我|我们|本人|这个能力|该能力)?(可以|能|能够|会|专门|主要|擅长|提供|支持)?/g, '')
      .replace(/^(帮|为|给|替)(人|别人|客户|用户|商家|企业)?/g, '')
      .replace(/^(做|从事|负责|提供)/g, '')
      .trim();
    return first.slice(0, 22) || '未命名能力';
  }

  function recognize(text) {
    const raw = String(text || '').trim();
    const norm = normalize(raw);
    let best = { type: TYPES[TYPES.length - 1], hits: [] };
    for (const t of TYPES) {
      const hits = t.keywords.filter((k) => norm.includes(normalize(k)));
      if (hits.length > best.hits.length) best = { type: t, hits };
    }
    const type = best.type;

    const priceMatch = norm.match(/(\d+(?:\.\d+)?)\s*(?:元|块|ut)/);
    const price = priceMatch ? Number(priceMatch[1]) : Math.round((type.priceRange[0] + type.priceRange[1]) / 2);
    const dMatch = norm.match(/(\d+(?:\.\d+)?)\s*(分钟|小时|天|工作日)\s*(?:内|以内|左右)?/);
    const delivery = dMatch
      ? `约 ${dMatch[1]}${dMatch[2]}${/内|以内/.test(dMatch[0]) ? '内' : ''}`
      : type.delivery;

    let unit = type.unit;
    if (/一份|每份|按份/.test(norm)) unit = '份';
    if (/一次|每次|按次/.test(norm)) unit = '次';
    if (/千字/.test(norm)) unit = '千字';
    if (/每小时|按小时/.test(norm)) unit = '小时';

    const dictTags = ALL_KEYWORDS.filter((k) => norm.includes(normalize(k)));
    let tags = [...new Set([...best.hits, ...dictTags])].slice(0, 8);
    if (tags.length < 3) tags = [...new Set([...tags, ...type.keywords])].slice(0, 8);

    const evidence = [...best.hits];
    if (priceMatch) evidence.push(`识别到报价 ${price} 元`);
    if (dMatch) evidence.push(`识别到交付时间 ${dMatch[1]}${dMatch[2]}`);

    const warnings = [];
    if (!priceMatch) warnings.push('未识别到报价，已按同类能力给出建议价，可自行修改。');
    if (!dMatch) warnings.push('未识别到交付时效，已使用同类平均时效。');
    if (type.type === '通用能力') warnings.push('没有识别到明确的能力类型，建议补充「面向谁、交付什么、怎么验收」。');

    let confidence = 0.48 + Math.min(best.hits.length, 4) * 0.08;
    if (priceMatch) confidence += 0.12;
    if (dMatch) confidence += 0.1;
    if (tags.length >= 3) confidence += 0.08;
    if (type.type === '通用能力') confidence -= 0.15;
    confidence = Math.max(0.3, Math.min(0.97, confidence));

    return {
      draft: {
        name: cleanTitle(raw),
        summary: raw,
        type: type.type,
        tags,
        price,
        unit,
        delivery,
        availability: '需预约确认',
        inputs: ['需求描述', '可选：相关数据文件'],
        outputs: type.outputs,
        audience: '不限',
        rawText: raw,
      },
      recognition: {
        version: 'demo-rule-v1',
        confidence: Number(confidence.toFixed(2)),
        type: type.type,
        evidence: evidence.length ? evidence : ['按描述归类为通用能力'],
        warnings,
      },
      sampleTask: { brief: type.sample },
    };
  }

  function deliverable(cap, requirement) {

${requirement || '按已发布能力标准完成一次服务。'}

交付物：${(cap.outputs || []).join('、') || '结果文件'} · 执行说明`;

  function matchAgents(requirement, budget) {
    const norm = normalize(requirement);
    const out = [];
    for (const agent of db.agents) {
      if (agent.permission !== 'public') continue;
      for (const cap of agent.capabilities || []) {
        if (cap.readiness && !cap.readiness.passed) continue;
        const tags = cap.tags || [];
        let hits = tags.filter((t) => norm.includes(normalize(t)));
        for (const g of ALIASES) {
          if (!g.demand.some((w) => norm.includes(w))) continue;
          for (const t of tags) {
            if (g.tags.includes(t) && !hits.includes(t)) hits.push(t);
          }
        }
        if (!hits.length) continue;
        const coverage = Math.min(1, hits.length / Math.max(2, Math.min(5, tags.length)));
        const price = cap.price || 0;
        const priceFit = !budget ? 0.75 : price <= budget ? 1 : Math.max(0, 1 - (price - budget) / Math.max(budget, 1));
        const readinessScore = cap.readiness ? (cap.readiness.score || 70) / 100 : 0.8;
        const speed = Math.max(0, 1 - Math.min(agent.latency || 2000, 3000) / 3000);
        let score =
          coverage * 0.5 + readinessScore * 0.2 + Math.min(1, (agent.rating || 0) / 5) * 0.15 + priceFit * 0.1 + speed * 0.05;
        if (!agent.online) score *= 0.92;

        const reasons = [];
        if (hits.length) reasons.push(`能力命中：${hits.slice(0, 3).join('、')}`);
        if (cap.readiness) reasons.push(`能力已装配 · 试运行 ${cap.readiness.score} 分`);
        if (!budget || price <= budget) reasons.push(`报价 ${price} UT，在预算内`);
        else reasons.push(`报价 ${price} UT，超出预算 ${price - budget} UT`);
        if (agent.rating >= 4.8) reasons.push(`评分 ${agent.rating}，历史交付 ${agent.completed} 单`);

        out.push({
          agentId: agent.id,
          agentName: agent.name,
          avatar: agent.avatar,
          color: agent.color,
          tagline: agent.tagline,
          online: agent.online,
          rating: agent.rating,
          completed: agent.completed,
          permission: agent.permission,
          capabilityId: cap.id,
          capabilityName: cap.name,
          price,
          unit: cap.unit,
          delivery: cap.delivery,
          readiness: cap.readiness || null,
          score: Math.round(Math.max(0, Math.min(1, score)) * 100),
          reasons,
        });
      }
    }
    return out.sort((a, b) => b.score - a.score).slice(0, 6);
  }

      worker: byAgent ? 'agent' : 'owner',

        tags: draft.tags.slice(0, 10),
        price: Number(draft.price),

function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} 小时前`;
  return `${Math.floor(h / 24)} 天前`;
}

function countdownText(deadline) {
  const left = Math.max(0, deadline - Date.now());
  const s = Math.floor(left / 1000);
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function toast(msg, isErr) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.className = `toast on${isErr ? ' err' : ''}`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.className = 'toast'; }, 3200);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

  else if (state.view === 'network') view.innerHTML = networkView();
  else if (state.view === 'orders') view.innerHTML = ordersView();
  else view.innerHTML = walletView();

function renderSoft() {
  if (!state.data) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;

  if (state.view === 'home' && state.draft) return;

      <div class="row" style="gap:8px">
        <span class="chip">买家：${esc(order.buyerName)}</span>
        <span class="chip">金额：${money(order.amount)} UT</span>
        <span class="chip ${order.handler === 'agent' ? 'accent' : 'blue'}">${order.handler === 'agent' ? '智能体执行' : order.handler === 'owner' ? '本人执行' : '待接管'}</span>
      </div>
      ${order.status === 'pending_owner' ? `<div class="row" style="gap:6px"><span class="tiny dim">接管倒计时</span><span class="countdown" data-deadline="${order.deadline}">${countdownText(order.deadline)}</span></div>` : ''}
    </div>

    <div class="divider" style="margin:16px 0"></div>
    <div class="card-title" style="margin:0 0 10px">过程</div>
    <div class="timeline">
      ${order.events
        .map(
          (e) => `<div class="tl-item ${e.actor}">
            <div class="tl-dot"></div>
            <div>
              <div class="tl-text">${esc(e.text)}</div>
              <div class="tl-time">${timeStr(e.ts)}</div>
            </div>
          </div>`,
        )
        .join('')}
    </div>

    ${
      a
        ? `<div class="divider" style="margin:16px 0"></div>
          <div class="card-title" style="margin:0 0 10px">结算归属</div>
          <div class="split-box">
            <div class="split-item"><div class="split-label">订单金额</div><div class="split-val">${money(a.total)} UT</div></div>
            <div class="split-item"><div class="split-label">智能体</div><div class="split-val accent">${money(a.agentIncome)} UT</div></div>
            <div class="split-item"><div class="split-label">本人</div><div class="split-val">${money(a.ownerIncome)} UT</div></div>
          </div>
          <p class="tiny dim" style="margin-top:8px">实际执行方：${a.worker === 'agent' ? '智能体代劳' : '本人亲自完成'}，整笔收入归执行方。</p>`
        : ''
    }

    ${
      order.artifact
        ? `<div class="divider" style="margin:16px 0"></div>
          <div class="row between">
            <div class="card-title" style="margin:0">交付物</div>
            <span class="chip ${order.artifact.deliveredBy === 'agent' ? 'accent' : 'blue'}">${order.artifact.deliveredBy === 'agent' ? '智能体交付' : '本人交付'}</span>
          </div>
          <div class="artifact" style="margin-top:10px">${esc(order.artifact.content)}</div>`
        : ''
    }

    <div class="row" style="margin-top:16px;gap:8px">${orderActions(order)}</div>
  `;
}

function orderActions(order) {
  const b = [];
  if (order.status === 'pending_owner') {
    b.push(`<button class="btn small primary" data-action="order-act" data-id="${order.id}" data-act="take">我来处理</button>`);
    b.push(`<button class="btn small" data-action="order-act" data-id="${order.id}" data-act="handover">交给智能体</button>`);
    b.push(`<button class="btn small danger" data-action="order-act" data-id="${order.id}" data-act="cancel">取消订单</button>`);
  } else if (order.status === 'human_running') {
    b.push(`<button class="btn small primary" data-action="order-act" data-id="${order.id}" data-act="finish">完成并交付</button>`);
    b.push(`<button class="btn small" data-action="order-act" data-id="${order.id}" data-act="handover">交给智能体</button>`);
  } else if (order.status === 'agent_running') {
    b.push(`<span class="tiny dim">智能体正在执行，稍候自动交付…</span>`);
  } else if (order.status === 'delivered') {
    b.push(`<button class="btn small primary" data-action="order-act" data-id="${order.id}" data-act="confirm">${order.direction === 'inbound' ? '模拟买家验收' : '确认验收'}</button>`);
    b.push(`<button class="btn small danger" data-action="order-act" data-id="${order.id}" data-act="dispute">发起争议</button>`);
  } else if (order.status === 'settled') {
    b.push(`<span class="tiny dim">已结算完成</span>`);
  }
  return b.join('');
}

   钱包

        <div class="stat-label">我的服务收入</div>

/* ============================================================
   交互
   ============================================================ */

function collectDraft() {
  const d = state.draft;
  if (!d) return null;
  const name = $('#f-name')?.value.trim();
  const price = Number($('#f-price')?.value || 0);
  const unit = $('#f-unit')?.value.trim() || '次';
  const delivery = $('#f-delivery')?.value.trim() || '约 30 分钟';
  const tags = ($('#f-tags')?.value || '').split(/[,，、\s]+/).map((s) => s.trim()).filter(Boolean);
  const knowledge = $('#f-knowledge')?.value.trim() || '';
  const outputs = ($('#f-outputs')?.value || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  state.executor = $('#f-executor')?.value || state.executor;
  state.draft = { ...d, name, price, unit, delivery, tags, knowledge, outputs };
  return state.draft;
}

function openModal(html) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal">${html}</div>`;
  root.classList.add('on');
}

function closeModal() {
  $('#modal-root').classList.remove('on');
  $('#modal-root').innerHTML = '';
  state.buyTarget = null;
}

async function withBusy(btn, fn) {
  if (state.busy) return;
  state.busy = true;
  if (btn) btn.disabled = true;
  try {
    await fn();
  } catch (err) {
    toast(err.message, true);
  } finally {
    state.busy = false;
    if (btn) btn.disabled = false;
  }
}

function bindEvents() {
  $('#nav').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-view]');
    if (!btn) return;
    state.view = btn.dataset.view;
    state.selectedOrderId = null;
    render();
  });

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    handleAction(action, el).catch((err) => toast(err.message, true));
  });

  $('#modal-root').addEventListener('click', (e) => {
    if (e.target.id === 'modal-root') closeModal();
  });

  // 每秒刷新倒计时
  setInterval(() => {
    $$('[data-deadline]').forEach((el) => {
      const left = Number(el.dataset.deadline) - Date.now();
      el.textContent = countdownText(Number(el.dataset.deadline));
      if (left < 10000) el.classList.add('urgent');
    });
  }, 1000);

  // 轮询状态推进
  setInterval(async () => {
    try {
      state.data = await api('/api/bootstrap');
      renderSoft();
    } catch (_) { /* ignore */ }
  }, 2000);
}

async function handleAction(action, el) {
  switch (action) {
    case 'refresh':
      await api('/api/bootstrap').then((d) => { state.data = d; render(); });
      break;

    case 'example': {
      const ta = $('#ability-text');
      if (ta) { ta.value = el.dataset.text; ta.focus(); }
      break;
    }

    case 'recognize': {
      const text = $('#ability-text')?.value.trim() || '';
      if (text.length < 6) return toast('再具体描述一点', true);
      await withBusy(el, async () => {
        const r = await api('/api/recognize', { method: 'POST', body: { text } });
        state.recognition = r.recognition;
        state.draft = {
          ...r.draft,
          sampleRequirement: r.sampleTask.brief,
          knowledge: '',
          outputs: r.draft.outputs || [],
        };
        state.readiness = null;
        state.executor = myAgents()[0]?.id || 'ag_mine';
        render();
      });
      break;
    }

    case 'reset-draft':
      state.draft = null;
      state.recognition = null;
      state.readiness = null;
      render();
      break;

    case 'trial': {
      const draft = collectDraft();
      if (!draft) return;
      await withBusy(el, async () => {
        state.readiness = await api('/api/readiness', { method: 'POST', body: { draft } });
        render();
        if (state.readiness.ready) toast('试运行通过，能力已具备');
        else toast('还差几项，补齐后才能发布', true);
      });
      break;
    }

    case 'publish': {
      const draft = collectDraft();
      if (!draft) return;
      await withBusy(el, async () => {
        await api(`/api/agents/${state.executor}/capabilities`, { method: 'POST', body: { draft } });
        toast('能力已发布，订单会先到你这里，超时由智能体代劳');
        state.draft = null;
        state.recognition = null;
        state.readiness = null;
        state.data = await api('/api/bootstrap');
        render();
      });
      break;
    }

    case 'simulate': {
      await withBusy(el, async () => {
        const agentId = el.dataset.agent;
        const capabilityId = el.dataset.cap;
        await api('/api/simulate/inbound', { method: 'POST', body: { agentId, capabilityId } });
        toast('模拟买家已下单，倒计时开始');
        state.data = await api('/api/bootstrap');
        render();
      });
      break;
    }

    case 'toggle-auto': {
      const agent = agentById(el.dataset.agent);
      await withBusy(el, async () => {
        await api(`/api/agents/${agent.id}`, { method: 'PATCH', body: { autoServe: !agent.autoServe } });
        state.data = await api('/api/bootstrap');
        render();
        toast(agent.autoServe ? '已关闭自动代劳' : '已开启自动代劳');
      });
      break;
    }

    case 'toggle-perm': {
      const agent = agentById(el.dataset.agent);
      const next = agent.permission === 'public' ? 'private' : 'public';
      await withBusy(el, async () => {
        await api(`/api/agents/${agent.id}`, { method: 'PATCH', body: { permission: next } });
        state.data = await api('/api/bootstrap');
        render();
        toast(next === 'public' ? '已公开，外部买家可以下单' : '已收回，仅自己可用');
      });
      break;
    }

    case 'match': {
      const requirement = $('#match-input')?.value.trim() || '';
      const budget = Number($('#match-budget')?.value || 0);
      if (requirement.length < 4) return toast('请描述你的需求', true);
      await withBusy(el, async () => {
        state.matchResult = await api('/api/match', { method: 'POST', body: { requirement, budget } });
        render();
      });
      break;
    }

    case 'buy': {
      const agent = agentById(el.dataset.agent);
      const cap = agent?.capabilities.find((c) => c.id === el.dataset.cap);
      if (!agent || !cap) return;
      state.buyTarget = { agent, cap };
      openModal(`
        <h3>托管下单</h3>
        <p class="modal-sub">${esc(agent.name)} · ${esc(cap.name)}<br/>资金先托管，验收后才结算；即使服务方不在，也由智能体兜底交付。</p>
        <label class="field">需求描述
          <textarea class="input" id="buy-requirement" placeholder="${esc(state.matchResult?.requirement || '说清楚你要什么、交付标准是什么')}">${esc(state.matchResult?.requirement || '')}</textarea>
        </label>
        <div class="row between" style="margin-top:14px">
          <span class="tiny dim">本单金额</span>
          <span class="cap-price" style="font-size:16px">${money(cap.price)} UT</span>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" data-action="close-modal">取消</button>
          <button class="btn primary" data-action="confirm-buy">确认托管</button>
        </div>
      `);
      break;
    }

    case 'close-modal':
      closeModal();
      break;

    case 'confirm-buy': {
      const { agent, cap } = state.buyTarget || {};
      const requirement = $('#buy-requirement')?.value.trim();
      if (!agent || !cap) return;
      if (!requirement) return toast('请填写需求', true);
      await withBusy(el, async () => {
        const order = await api('/api/orders', {
          method: 'POST',
          body: { agentId: agent.id, capabilityId: cap.id, requirement, amount: cap.price },
        });
        closeModal();
        toast('下单成功，智能体已开始执行');
        state.data = await api('/api/bootstrap');
        state.view = 'orders';
        state.orderTab = 'outbound';
        state.selectedOrderId = order.id;
        render();
      });
      break;
    }

    case 'order-tab':
      state.orderTab = el.dataset.tab;
      state.selectedOrderId = null;
      render();
      break;

    case 'select-order':
      state.selectedOrderId = el.dataset.id;
      render();
      break;

    case 'order-act': {
      await withBusy(el, async () => {
        await api(`/api/orders/${el.dataset.id}/actions`, { method: 'POST', body: { action: el.dataset.act } });
        state.data = await api('/api/bootstrap');
        state.selectedOrderId = el.dataset.id;
        render();
        const map = {
          take: '已接管，请在时限内完成',
          handover: '已交给智能体，它会完成并交付',
          finish: '已交付，等待买家验收',
          confirm: '验收完成，已按实际执行方结算',
          cancel: '订单已取消，托管资金已退回',
          dispute: '已发起争议，等待平台处理',
        };
        toast(map[el.dataset.act] || '操作完成');
      });
      break;
    }
  }
}

/* ============================================================
   启动
   ============================================================ */

async function init() {
  bindEvents();
  try {
    state.data = await api('/api/bootstrap');
    const first = myAgents()[0];
    if (first) state.executor = first.id;
    render();
  } catch (err) {
    $('#view').innerHTML = emptyBlock(`加载失败：${err.message}`);
  }
}

init();

  </script>
